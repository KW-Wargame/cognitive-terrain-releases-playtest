<script>(()=>{var Ae={OBS:{name:"PERCEPTION",ooda:"OBSERVE",short:"O",what:"What this side notices and accepts as credible: news, feeds, field reports, intelligence summaries.",fx:"Saturation",fxd:"Loses sight of the opposing brain (values hidden)."},ORI:{name:"SENSEMAKING",ooda:"ORIENT",short:"O",what:"How information is interpreted: threat framing, attribution, analogies, expert commentary.",fx:"Framing bias",fxd:"Staff re-litigate assumptions: every capability costs +1 IP."},DEC:{name:"DECISION",ooda:"DECIDE",short:"D",what:"Judgment and choice: leaders, cabinets, risk tolerance, escalation thresholds.",fx:"Hesitation",fxd:"Decision latency: \u22121 action per turn."},ACT:{name:"WILL",ooda:"ACT",short:"A",what:"Execution: units, logistics, morale, public compliance, follow-through.",fx:"Misaligned action",fxd:"25% of actions misfire (premature or non-action)."},TRU:{name:"TRUST",ooda:"CHRONIC",short:"T",what:"Long-horizon conditioning: institutional trust, cohesion, identity, credibility routing.",fx:"Credibility inversion",fxd:"Official responses at half weight, resilience halved, enemy engagement +1 grade."}},de=["OBS","ORI","DEC","ACT","TRU"],na={OBS:[["Public Newsfeeds","Population"],["Open-Source Analysts","Organization"],["Intelligence Summaries","Organization"],["Field Reporting","Unit"],["Rumor Networks","Population"],["Indications & Warning","Organization"],["Commander's Daily Brief","Individual"],["Crisis Hotlines","Population"]],ORI:[["Threat Framing","Organization"],["Attribution Judgments","Organization"],["Historical Analogies","Individual"],["Expert Commentary","Population"],["Staff Interpretation","Organization"],["Risk Narratives","Population"],["Strategic Culture","Institution"],["Mirror-Imaging","Individual"]],DEC:[["Cabinet Deliberation","Institution"],["Risk Tolerance","Individual"],["Escalation Thresholds","Institution"],["Option Set","Organization"],["Planning Staff","Organization"],["Decision Tempo","Organization"],["Crisis Cell","Organization"]],ACT:[["Execution Fidelity","Unit"],["Mobilization Will","Population"],["Troop Morale","Unit"],["Public Compliance","Population"],["Logistics Tempo","Organization"],["Alliance Follow-Through","Institution"],["Resolve","Individual"]],TRU:[["Institutional Trust","Population"],["Alliance Confidence","Institution"],["Social Cohesion","Population"],["Media Credibility","Population"],["Shared Identity","Population"],["Legitimacy","Institution"],["Credibility Routing","Organization"],["Civic Memory","Population"]]},dt={OBS:{name:"PRESS",label:"Press & Broadcast",level:"Population",aud:"press and broadcast audiences",held:"Attacker reach +0.5 engagement on every transmission into this brain.",real:"Outlets that look credible lend borrowed authority to whatever runs through them."},TRU:{name:"SOCIAL",label:"Social Platforms",level:"Population",aud:"social platform users",held:"Attacker Amplification hits every linked node at full strength.",real:"Platforms are where coordinated inauthentic behavior manufactures perceived consensus."},ORI:{name:"DIPLOMATIC",label:"Diplomatic Channels",level:"Institution",aud:"diplomatic contacts and envoys",held:"Attacker gains +2 IP per turn from elite access.",real:"Access to elites and envoys is cheap influence: a few conversations shape many decisions."}};var ao=[{id:"D1",round:4,name:"The Relief Flotilla",vp:1,setup:"Typhoon Ines has flattened much of the Kalvara Islands, a small republic that buys from both Blue and Olvana. Relief ships from both arrive the same week. Within a day, a video claims Blue's bottled water made children sick. Nobody can yet say whether it is true.",B:{SOUND:"Blue tested a sample batch publicly within hours, posted the lab results and kept distribution running.",DELAYED:"Blue suspended water handouts for two days while teams waited on test results, and lines at the depots turned angry.",ERROR:"Blue pulled its entire water supply and apologized before testing. The batch was clean, but the apology became the story."},R:{SOUND:"Olvana let the video circulate without comment and kept its own relief crews visible.",DELAYED:"Olvana's embassy and its state media gave two different accounts of the video.",ERROR:"Olvana's officials repeated the claim as fact on camera, and it was disproved by evening."}},{id:"D2",round:8,name:"The Blackout",vp:1,setup:"The undersea cable that carries most of Kalvara's internet traffic goes dark. Islanders are cut off from family abroad and from relief updates. Both Blue and Olvana offer to restore service, and both are accused of cutting the line.",B:{SOUND:"Blue flew in satellite terminals for clinics and the council within 48 hours and let Kalvara's own engineers lead the cable inspection.",DELAYED:"Blue's offer stalled in interagency review while Olvana's technicians were already on the beach.",ERROR:"Blue publicly blamed Olvana for the cut before any inspection. The cause turned out to be storm damage."},R:{SOUND:"Olvana offered repair ships with no conditions attached and stayed out of the blame game.",DELAYED:"Olvana spent a week arguing internally over whether to attach conditions to its offer.",ERROR:"Olvana made its repair offer conditional on a port agreement, and Kalvara's press called it extortion."}},{id:"D3",round:12,name:"The False Alarm",vp:1,setup:"A second storm is forming. At 3 a.m., an evacuation alert with an official-looking seal spreads across the islands, ordering coastal towns to move inland. Kalvara's weather office says it did not send it. Thousands are already on the roads.",B:{SOUND:"Blue's liaison helped the weather office push a verified correction through radio and loudspeakers within the hour.",DELAYED:"Blue waited for confirmation from three agencies before saying anything, and the roads stayed jammed until noon.",ERROR:"Blue's relief teams amplified the fake alert in good faith and moved their own staff inland."},R:{SOUND:"Olvana stayed silent and let confusion about the alert's origin do its work.",DELAYED:"Olvana's media hedged, neither endorsing nor denying the alert.",ERROR:"Olvana-linked accounts were caught resharing the alert minutes before it first appeared publicly."}},{id:"D4",round:16,name:"The Reconstruction Compact",vp:2,setup:"Kalvara's island council votes on a ten-year reconstruction partner for its ports, power grid and network. The council is listening to its public, and the public has spent sixteen weeks deciding whom to believe. This decision point counts double.",B:{SOUND:"Blue made a clear, consistent offer and kept its promises visible. The council chose Blue.",DELAYED:"Blue revised its offer twice in the final week, and the council postponed the vote.",ERROR:"Blue's envoys contradicted each other on terms, and the council chose Olvana."},R:{SOUND:"Olvana's pressure campaign stayed coherent to the end.",DELAYED:"Olvana could not decide whether to raise its offer or wait.",ERROR:"Olvana's last-minute threat to cut trade backfired with undecided council members."}}];["OBS","ORI","ACT","TRU"].forEach((e,t)=>ao[t].test=e);var Oe=[{id:"kalvara",name:"Typhoon Ines",place:"the Kalvara Islands",tag:"Disaster relief in a small island republic.",intro:"Typhoon Ines has just devastated the Kalvara Islands, a small republic that trades with both Blue and Olvana. Over the next sixteen weeks of relief and rebuilding, Kalvara will choose whom to trust.",twist:"No special conditions. The best first campaign.",topics:["the bottled-water video","the cable cut","the evacuation alert","aid diversion","the reconstruction deal"],tags:["KalvaraTruth","InesRelief","CableCut","WhoToTrust"],outlets:{B:["Meridian Wire","Blue Public Broadcast","the Coastal Courier"],R:["Olvana Central Television","the Harbor Daily","Lantern-net"]},crises:ao},{id:"valmora",name:"The Valmora Vote",place:"Valmora",tag:"A snap election in a partner democracy.",intro:"Valmora, a democracy and a Blue trading partner, holds a snap election after its government collapses. Olvana quietly favors a candidate who promises to cancel the Blue trade pact. Sixteen weeks to election and inauguration.",twist:"Polarized season: both TRUST areas start weakened (Blue's more), and AI Synthetic Media arrives first.",start:{B:{TRU:78},R:{TRU:85}},di:["synth","bots","troll","robot"],topics:["the leaked audio","pre-marked ballots","the vote count","foreign meddling","the trade pact"],tags:["ValmoraVotes","CountEveryBallot","StolenVote","ValmoraDecides"],outlets:{B:["Meridian Wire","Blue Public Broadcast","the Capital Ledger"],R:["Olvana Central Television","Lantern-net","the Northern Herald"]},crises:[{id:"D1",round:4,name:"The Leaked Audio",vp:1,test:"ORI",setup:"A recording surfaces of Valmora's finance minister apparently promising Blue contracts in exchange for campaign help. Experts cannot agree whether the voice is real or synthetic.",B:{SOUND:"Blue declined to comment on an unverified clip, pointed to independent forensic labs and let them work. Their finding of synthetic audio landed with credibility.",DELAYED:"Blue's agencies took four days to agree on a line, and the clip defined the week.",ERROR:'A Blue official called the clip "obviously fake" before any analysis, which made Blue look involved.'},R:{SOUND:"Olvana amplified the questions without endorsing the clip, keeping doubt alive.",DELAYED:"Olvana's outlets hesitated, unsure whether the clip would hold up.",ERROR:"Olvana state media aired the clip as proven fact hours before labs flagged it as synthetic."}},{id:"D2",round:8,name:"The Ballot Rumor",vp:1,test:"OBS",setup:"Posts claim ballots in two provinces were pre-marked. Photos circulate of sealed boxes being moved at night. Turnout in those provinces is expected to decide the race.",B:{SOUND:"Blue backed Valmora's election commission in publishing chain-of-custody video for every box, and the rumor stalled.",DELAYED:"Blue's support for the commission came after the rumor had already peaked.",ERROR:'Blue observers mentioned "minor irregularities", which was clipped and spread as proof of fraud.'},R:{SOUND:"Olvana-linked accounts kept the rumor circulating in small, believable doses.",DELAYED:"Olvana's networks pushed the rumor too late to shape turnout.",ERROR:`Olvana outlets published a photo of the "boxes" that turned out to come from another country's election.`}},{id:"D3",round:12,name:"Count Night",vp:1,test:"DEC",setup:"Counting runs late. Both candidates declare victory before midnight, crowds gather outside the election commission, and foreign governments are expected to say something.",B:{SOUND:"Blue said publicly it would wait for official results and urged calm, which became the line most Valmorans heard.",DELAYED:"Blue's statement came the next afternoon, after crowds had already clashed.",ERROR:"A Blue envoy congratulated a candidate early and had to retract it."},R:{SOUND:"Olvana stayed quiet in public while its networks questioned the count.",DELAYED:"Olvana could not decide whether to back its preferred candidate openly.",ERROR:"Olvana congratulated its preferred candidate before the count finished, uniting Valmorans against foreign meddling."}},{id:"D4",round:16,name:"Transfer of Power",vp:2,test:"TRU",setup:"The winner takes office. Whether the losing side accepts the result depends on how much Valmorans still trust their institutions. This decision point counts double.",B:{SOUND:"Valmora's institutions held, the transfer was peaceful, and the trade pact survived.",DELAYED:"The transfer happened, but weeks of protests followed and the pact was frozen.",ERROR:"The losing candidate refused to concede, and the new government cancelled the pact to calm the streets."},R:{SOUND:"Olvana's campaign left Valmora divided and distrustful, a win in itself.",DELAYED:"Olvana's influence faded as the transfer went ahead.",ERROR:"Exposure of Olvana's networks became the story of inauguration week."}}]},{id:"varrin",name:"Collision at Varrin Reef",place:"Teluga",tag:"A maritime incident at a disputed reef.",intro:"An Olvanan coast guard cutter and a fishing boat from Teluga, a small Blue ally, collide at Varrin Reef, waters both Teluga and Olvana claim. Two fishermen are missing. The region is watching who tells the story best.",twist:"Diplomatic scramble: both sides' OFFICIALS entry points start weakened, so the fight over envoys and elites starts on day one.",start:{B:{gate:{DIPLOMATIC:45}},R:{gate:{DIPLOMATIC:45}}},topics:["the collision video","the missing fishermen","the reef drills","the tribunal ruling","historic fishing rights"],tags:["VarrinReef","BringThemHome","ReefTruth","HistoricWaters"],outlets:{B:["Meridian Wire","Blue Public Broadcast","the Teluga Times"],R:["Olvana Central Television","Ocean Voice","Lantern-net"]},crises:[{id:"D1",round:4,name:"Two Videos",vp:1,test:"OBS",setup:"Two videos of the collision appear within hours: one shows the cutter ramming the boat, the other shows the boat swerving into the cutter. One of them has been edited.",B:{SOUND:"Blue released timestamped satellite imagery and let independent analysts compare the videos.",DELAYED:"Blue held its imagery for review for a week, and the edited video set the story.",ERROR:"Blue shared the more dramatic video first. It was the edited one."},R:{SOUND:"Olvana released the cutter's logbook quickly and stuck to it.",DELAYED:"Olvana's ministries released conflicting timelines.",ERROR:"Olvana's spokesperson claimed the fishing boat was armed, which no footage supported."}},{id:"D2",round:8,name:"The Missing Crew",vp:1,test:"ACT",setup:"The two missing fishermen are reported to be held on an Olvanan-controlled island. Their families plead on television, and rumors spread that the men have been mistreated.",B:{SOUND:"Blue worked quiet diplomatic channels, kept the families informed, and the men were released.",DELAYED:"Blue's public pressure and private talks pulled in different directions for weeks.",ERROR:"Blue officials repeated the mistreatment rumor publicly before it was confirmed. It was false."},R:{SOUND:"Olvana released photos of the men in good health and returned them as a goodwill gesture.",DELAYED:"Olvana stayed silent too long, letting the worst rumors grow.",ERROR:"Olvana paraded the men on state television, a scene that shocked the region."}},{id:"D3",round:12,name:"The Drills",vp:1,test:"ACT",setup:"Olvana announces naval drills around the reef. Teluga fears a blockade, and shipping insurers raise their rates overnight.",B:{SOUND:"Blue published a measured, pre-planned patrol schedule, which calmed insurers.",DELAYED:"Blue debated for a week whether to respond at all.",ERROR:"Blue rushed warships to the area without a plan, and the incident nearly repeated itself."},R:{SOUND:"Olvana kept its drills inside predictable limits, making its point without escalating.",DELAYED:"Olvana extended the drills twice without explanation.",ERROR:"An Olvanan jet flew dangerously close to a commercial airliner, and regional opinion turned sharply."}},{id:"D4",round:16,name:"The Tribunal Ruling",vp:2,test:"DEC",setup:"An international tribunal rules on the reef. Both sides will spin the ruling, and how the region interprets it decides who leaves stronger. This decision point counts double.",B:{SOUND:"Blue welcomed the ruling plainly and let Teluga lead. The region saw a rules-based outcome.",DELAYED:"Blue's reaction was buried in legal language and missed the news cycle.",ERROR:"Blue overclaimed the ruling as a defeat for Olvana, and neighbors grew wary of both."},R:{SOUND:"Olvana dismissed the tribunal calmly and framed the reef as a historic matter.",DELAYED:"Olvana's response wavered between rejection and negotiation.",ERROR:"Olvana threatened Teluga's fishing fleet, confirming the region's worst fears."}}]},{id:"sabre",name:"Fever in Port Sabre",place:"Port Sabre",tag:"An outbreak in a trading city-state.",intro:"A fast-spreading respiratory virus appears in Port Sabre, a trading city-state that depends on both Blue and Olvana. Both rush to supply tests and vaccines. Rumors move faster than the virus.",twist:"Infodemic: rumors spread faster for both sides (held nodes push harder), and both NOTICE areas start strained.",cfg:{spread:6},start:{B:{OBS:75},R:{OBS:75}},topics:["the lab rumor","the vaccine batch","the forged lockdown order","the health accord","miracle cures"],tags:["SabreFever","LabLeakSabre","SafeShots","SabreStrong"],outlets:{B:["Meridian Wire","Blue Public Broadcast","the Sabre Gazette"],R:["Olvana Central Television","Lantern-net","Health Herald"]},crises:[{id:"D1",round:4,name:"Patient Zero",vp:1,test:"ORI",setup:"A viral post claims the outbreak started at a Blue-funded research lab near the harbor. The city's doctors have no data yet on where it began.",B:{SOUND:"Blue invited Port Sabre's own scientists into the lab and published the inspection.",DELAYED:"Blue's denial took a week to clear, and the lab story hardened.",ERROR:"Blue blamed Olvanan food markets with no evidence, and was mocked for it."},R:{SOUND:"Olvana kept asking questions about the lab without claiming anything it could not prove.",DELAYED:"Olvana's media went back and forth on the lab story.",ERROR:'Olvana officials presented a "lab document" that turned out to be fabricated.'}},{id:"D2",round:8,name:"The Bad Batch",vp:1,test:"TRU",setup:"Reports spread that one vaccine batch caused serious reactions. Which country made the batch is unclear, and clinics see a wave of cancellations.",B:{SOUND:"Blue's health agency published batch data and reaction rates in plain language, and clinics reopened.",DELAYED:"Blue's data release was held up in review while clinics stayed empty.",ERROR:'Blue declared the batch "perfectly safe" before seeing the data, and lost credibility when reactions were confirmed.'},R:{SOUND:"Olvana promoted its own vaccine steadily and avoided attacking Blue's.",DELAYED:"Olvana's health officials hesitated to share any data.",ERROR:"Olvana claimed its vaccine had zero side effects, which local doctors publicly disputed } one is Olvana's. Each dot is a group of people with a job in how a country thinks: reporters, analysts, leaders, soldiers, ordinary citizens. Over 16 weeks you protect your side and try to sway theirs.",src:"Rushing, Hersch & Xu (2026), Definition 3"},{t:"The terrain is a decision cycle",tc:"How a country makes up its mind",real:"Boyd's OODA loop breaks decision-making into Observe, Orient, Decide and Act. The framework treats each stage as contestable, and adds a chronic layer: trust and cohesion that shift slowly but change how every acute loop runs.",realc:"Every decision runs through four steps: notice what is happening, interpret it, decide, then act. Beneath them sits trust, which changes slowly but affects every step. Military planners call the four steps the OODA loop.",game:"Each brain has five regions: the four OODA stages plus TRUST underneath. Their names sit faintly on the map. When the enemy holds half of a region it is compromised: its name turns red on the map and its owner suffers a penalty. Settings (\u2699) can draw the full OODA overlay with outlines and arrows.",gamec:"Each brain is split into those five areas, named faintly on the map: the four steps, and TRUST underneath. If the other side wins half of an area, it is lost: its name turns red on the map and its owner suffers a penalty. Settings (\u2699) can draw outlines and arrows for the loop.",target:()=>mo("R"),src:"Multi-Horizon Cognitive OODA framework, Fig. 1 and Table 2"},{t:"Nodes are people and functions",tc:"Every dot is a group of people",real:"Cognitive effects work at several levels of analysis: individuals, units, organizations, institutions and whole populations. Effects at one level propagate to the others, especially when trust erodes.",realc:"Influence works on individuals, teams, organizations and whole populations, and it spreads between them: when the public stops trusting the news, leaders feel it too.",game:"Hover a few nodes. Each shows its OODA stage, its level of analysis and who controls it. Held nodes press on their links every week, so ground you take spreads, and isolated pushes fade as the owner recovers.",gamec:"Hover a few dots to see who they are, which step they belong to, and who has their ear. Dots you win push on their neighbors every week, so gains spread. Lone gains fade as the other side recovers.",target:()=>mo("R"),todo:"Hover any node in the Olvana brain.",todoc:"Hover any dot in the Olvana brain.",wait:()=>n.flags.hover>2},{t:"Gateways: access and delivery",tc:"Entry points",real:"The first attacker capability is persistent access to information pathways: local outlets, personas, look-alike accounts. Without access nothing else lands.",realc:"Before you can influence anyone you need a way to reach them: news outlets, social media accounts, contacts inside government. Everything else depends on that access.",game:"You can only strike Olvana through its gateways (\u25C7 PRESS, SOCIAL, DIPLOMATIC) or from nodes you already hold. Holding a gateway gives a standing bonus: PRESS boosts reach, SOCIAL boosts amplification, DIPLOMATIC adds income. Olvana's information firewall makes them recover faster.",gamec:"You can only reach Olvana through its entry points (\u25C7 NEWS, SOCIAL, OFFICIALS) or from dots you already lean. Holding one pays every turn: NEWS spreads your posts further, SOCIAL strengthens Bot Swarm, OFFICIALS adds budget. Olvana censors its internet, so these points bounce back faster.",target:()=>{let e=De("R","PRESS");return e?za(e,30):null},src:"\xA72.2.2 AC1 Access & Delivery"},{t:"Choose a capability",tc:"Pick a move",real:"The paper groups attacker capabilities into four families: access and delivery, content and narrative engineering, amplification, and adaptation. Each is strongest against a different OODA stage.",realc:"Influence campaigns use a handful of basic moves: get the message in, shape the story, make it loud, and adapt when it gets removed. Each works best at a different step of a decision.",game:"The bottom bar holds those four attacker families and the four defender families (keys 1 to 8). Select one and the panel on the right shows where it is strongest.",gamec:"The bottom bar holds four attacking moves and four defending moves (keys 1 to 8). Pick one and the panel on the right shows where it works best.",target:()=>Ct("#offCards"),todo:"Select SEED CHANNELS.",todoc:"Select PLANT STORIES.",wait:()=>n.sel&&n.sel.id==="access"},{t:"Read before you strike",tc:"Look before you act",real:"Delivery is an observation effect: it shapes what the audience notices and treats as credible. That makes intake points such as press and newsfeeds the natural first target.",realc:"Planting stories changes what people notice and what they believe is credible, so news outlets and feeds are the natural first target.",game:"Hover the PRESS gateway. The panel on the right projects the effect and explains why this capability fits this node in real life. Then click to execute.",gamec:"Hover the NEWS entry point. The panel on the right shows how strong the move will be and explains why someone would do this in real life. Then click to do it.",target:()=>{let e=De("R","PRESS");return e?za(e,30):null},todo:"Click the Olvana PRESS gateway.",todoc:"Click Olvana's NEWS entry point.",wait:()=>n.flags.acts>=1},{t:"Measure engagement",tc:"How far did it spread?",real:"Rushing and Xu (2025) grade a cognitive attack by weighted interactions per transmission: views \xD70.1, likes \xD70.3, comments \xD70.7, shares \xD71.0, graded F (failure) to A+ (viral).",realc:"Researchers score an influence post by how people react to it, counting shares most, then comments, likes and views, and grade it from F (nobody cared) to A+ (viral).",game:"Every offensive action rolls engagement, and the grade scales its effect. Some moves fail outright: removed, exposed or ignored. The result card shows what happened; open the full SITREP (\u25C9) from the card or the log.",gamec:"Every attack gets a spread grade, and a better grade means a stronger effect. Some moves fail outright: taken down, exposed or ignored. The result card shows what happened; click FULL STORY (or \u25C9 in the log) to read more.",target:()=>Ct("#info"),todo:"Open the full story (\u25C9) from the result card or the log.",wait:()=>n.flags.sitrep>=1,src:"Engagement effectiveness metric, Table 1"},{t:"Reach is not effect",tc:"Going viral is not winning",real:"Exposure and engagement show activity, not whether decisions got worse. Cognitive warfare is judged by decision-centric outcomes: latency, error, confidence, trust calibration.",realc:"A post can reach millions and change nothing. What matters is whether the other side starts deciding slower or worse.",game:"Decision Quality, shown under each brain's name and in the small panel, is the real scoreboard. At each decision point, sound decisions earn 3 VP, delayed ones 1, and errors hand the opponent a point.",gamec:"Decision Health, shown under each brain's name and in the small panel, is the real scoreboard. At each crisis, a healthy decision earns 3 points, a slow one 1, and a mistake hands the other side a point.",target:()=>Ct("#mtitle"),src:"Rushing, Hersch & Xu (2026), Table 3 and \xA73.4"},{t:"Defend: four capabilities",tc:"Protecting your side",real:"Defenders detect and assess, build resilience (prebunking and inoculation), respond with authoritative counter-framing, and learn. They pay more for it: verification, coordination and staffing are expensive.",realc:'Defenders spot campaigns, teach people the tricks in advance ("prebunking"), correct the record through trusted voices, and learn from each round. Defending costs more than attacking, because checking facts and coordinating takes time.',game:"Olvana attacks Blue every turn. Assessment Cell sets up harder responses, Prebunk halves incoming influence, Authoritative Response restores ground, After-Action Review compounds recovery.",gamec:"Olvana attacks every turn. Watch Team makes your corrections stronger, Prebunk halves incoming influence, Official Statement wins ground back, Lessons Learned speeds recovery for good.",view:"B",target:()=>Ct("#defCards"),src:"\xA72.3.2 Defender capabilities; \xA73.3.3 cost asymmetry"},{t:"Acute versus chronic",tc:"Fast damage, slow damage",real:"Chronic conditioning, such as eroded institutional trust or credibility inversion, re-parameterizes the acute loop: corrections take longer to land and deception works more often.",realc:"Some effects hit in hours. Others, like eroding trust in institutions, build up over months and make every later crisis harder to handle.",game:"Protect your TRUST region. If it falls, your official responses lose half their weight, your recovery halves, and every Olvana transmission lands a grade higher.",gamec:"Protect your TRUST area. If it falls, your statements count half, recovery halves, and every Olvana post spreads further.",view:"B",target:()=>ri("B","TRU"),src:"\xA72.4 and \xA73.4.2"},{t:"Two different kinds of opponent",tc:"Not a mirror match",real:"Open and closed societies fight this contest differently. A closed state filters its own information space, funds content at scale and centralizes decisions; an open society is easy to reach but has credible, independent institutions.",realc:"A democracy and a one-party state play this game differently. One has a free internet and an independent press; the other censors, pays for content at scale and runs everything from the top.",game:"Olvana's transmissions reach Blue more easily, its amplification is cheaper, and it starts with personas inside Blue's SOCIAL gateway. But centralized command makes DECIDE its single point of failure, and it learns slowly. Blue's truthful messaging sticks and its institutions hold. See Field Manual \xB7 Asymmetries.",gamec:"Olvana's posts reach you easily, Bot Swarm is cheap for it, and it already has fake accounts inside your SOCIAL entry point. But everything in Olvana runs through the top, so shaking its DECIDE area hurts it most, and it is slow to learn from mistakes. Your free press keeps your Trust strong, and true stories stick once believed. The Guide lists every difference.",view:"B",target:()=>mo("B"),src:"Shin (2026); Eads et al. (2023); ATP 3-13.1"},{t:"Decision points and innovations",tc:"Crises and new technology",real:"Acute effects play out in minutes to days, usually around a moment when someone must decide under pressure. Chronic conditioning in the weeks before decides how well they cope. Separately, new technologies keep changing the attacker's toolkit about every 4.6 years.",realc:"Real crises arrive suddenly and force fast decisions; how well a country copes depends on the weeks of pressure before. Meanwhile new technology such as bots and deepfakes keeps changing the tools, roughly every four or five years.",game:"Weeks 4, 8, 12 and 16 are decision points, marked on the timeline above the cards. Each tests one OODA stage, named in the top bar; that region is flagged on the map as it approaches. Weeks 2, 6, 10 and 14 bring a disruptive innovation: exploit it or invest in proactive defense. Sustained superiority (Olvana two or more compromised stages worse off than you, two weeks running) wins outright.",gamec:"Weeks 4, 8, 12 and 16 are crises, marked on the timeline above the cards. Each crisis tests one area, named in the top bar, and that area is flagged on the map as it gets close. Weeks 2, 6, 10 and 14 bring a new technology: use it, or prepare defenses against it. If Olvana stays at least two areas worse off than you for two weeks running, you win outright.",target:()=>Ct("#tline"),src:"\xA73.1 scenario; Rushing, Umeokolo & Xu (2025)"},{t:"Your move",tc:"Your move",real:"The paper's closing advice for the joint force is to rehearse cognitive contests in wargames before they happen for real. That is this game's purpose.",realc:"Researchers recommend practicing these contests in games before they happen for real. That is what this game is for.",game:"Spend your remaining actions, then End Turn and watch Olvana respond. The Field Manual covers every concept and source. You can replay this tutorial any time.",gamec:"Use your remaining moves, then End Turn and watch Olvana respond. The Guide explains every idea in plain words, and the PLAIN / MILITARY switch at the top changes the words at any time.",target:()=>Ct("#endTurn"),src:"\xA73.5.2 Implications for the Joint Force"}],Ho=(e,t)=>{let o=!p()&&e[t+"c"]||e[t];if(!o)return o;let a=ci();return o.replace("{B}",a.B).replace("{R}",a.R)},Y=null;function Fo(){Y={i:0},st()}function Ke(){Y=null,v("#coach").hidden=!0,v("#spot").hidden=!0}function st(){let e=vt[Y.i],t=v("#coach");t.innerHTML=`<div class="ck"><span>TUTORIAL \xB7 ${Y.i+1} / ${vt.length}</span><button class="ghost" type="button" id="tSkip" style="padding:2px 6px">Skip</button></div>

   <p>It differs from information operations in its target and its yardstick. IO coordinates information-related capabilities; cognitive warfare targets cognition directly and is judged by decision outcomes: quality, tempo, confidence and trust calibration. That is why this game scores crises on Decision Quality, not on how much content you pushed.</p>
   <h3>IN THE GAME</h3><p>Two brains are the terrain. Every node is a person, organization or population performing a cognitive function. You attack Olvana's and defend Blue's at the same time, because the paper treats offense and defense as one interacting contest.</p>`],["OODA",`<h3>MULTI-HORIZON COGNITIVE OODA</h3><p>The framework maps contestable functions to Boyd's Observe\u2013Orient\u2013Decide\u2013Act loop and adds a time dimension.</p>

   <tr><td>CHRONIC</td><td>Erode institutional trust, polarize, normalize false beliefs.</td><td>Preserve calibrated trust and cohesion.</td><td>Trust compromised: credibility inversion.</td></tr></table></div>
   <p>Acute effects land in minutes to days. Chronic effects accumulate over weeks to years and re-parameterize the acute loop by changing what is noticed, believed and seen as legitimate. In the game, a compromised Trust region makes every enemy transmission land a grade higher and halves your official responses.</p>`],["CAPABILITIES",`<h3>FOUR ATTACKER AND FOUR DEFENDER CAPABILITIES</h3><p>The eight cards are the paper's capability families, not arbitrary actions.</p>

   <p>Hover any node with a card selected to see the projected effect and the real-world reasoning for that specific pairing.</p>
   <h3>COST AND EFFICIENCY</h3><p>The paper treats cost as its own attribute family. Attackers generate and reseed content cheaply; defenders carry verification, coordination and staffing burdens. Detection alone does nothing until it speeds up a response, and learning compounds slowly. Plan your defense budget with that asymmetry in mind.</p>`],["ENGAGEMENT",`<h3>ENGAGEMENT EFFECTIVENESS METRIC</h3><p>Rushing and Xu (2025) grade cognitive attacks by weighted interactions per transmission: E = \u03A3(w\u2C7C\xB7i\u2C7C) / t, with views \xD70.1, likes \xD70.3, comments \xD70.7 and shares \xD71.0.</p>

   <p>Each offensive action rolls engagement. Gateways, a held PRESS gateway, a compromised enemy Trust region and exploited innovations push grades up; a Detected target pushes them down. Open any SITREP (\u25C9 in the log) to see the numbers.</p>

   <p class="note">Olvana is the ODIN DATE opposing force. All four scenarios, their places (the Kalvara Islands, Valmora, Teluga and Varrin Reef, Port Sabre) and every event in them are original fiction. Any resemblance to real places or events is coincidental.</p>`]];function Oi(){return`<h3>WHAT IS THIS GAME ABOUT?</h3>
  <p>Countries compete in many ways short of war. One of them is trying to change how the other side's people and leaders see events, make sense of them, and make decisions. The military calls the broad field <b>information operations</b>; researchers call the fight over how people think <b>cognitive warfare</b>. No one fires a shot. The goal is to make the other side decide slowly or badly, while keeping your own side clear-headed.</p>
  <h3>HOW A COUNTRY MAKES UP ITS MIND</h3>
  <p>Picture a town council hearing that a storm is coming. First people <b>notice</b> the warning. Then they <b>interpret</b> it: is it serious, who says so, have we seen this before? Then leaders <b>decide</b> whether to evacuate, and finally people <b>act</b>. Underneath all of it is <b>trust</b>: if nobody believes the weather office, every step goes worse. Military planners call the four steps the OODA loop (Observe, Orient, Decide, Act).</p>
